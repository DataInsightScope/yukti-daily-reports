name: Run Yukti Daily Report

on:
  schedule:
    - cron: '0 12 * * *'  # Runs daily at 5:30 PM IST (adjust if needed)
  workflow_dispatch:

jobs:
  run-notebook:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repo
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: 3.10

    - name: Install dependencies
      run: |
        pip install requests nbconvert

    - name: Run notebook
      run: |
        jupyter nbconvert --to script yukti_daily_report.ipynb
        python yukti_daily_report.py
